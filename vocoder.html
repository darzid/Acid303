<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js"></script>
</head>

<body>
	<button id="StartBtn">Start</button>
	<button id="StopBtn">Stop</button>
	<span id="peakFrequency"></span>
	<div id="midiNoteHistoryLog" style="max-height: 200px; overflow-y: auto"></div>
	<canvas id="visualizer"></canvas>
	
	<script src="./js/Visualizer.js"></script>
	<script type="module" src="./js/devices/Vocoder.js"></script>
	<script type="module">
import { Vocoder } from "./js/devices/Vocoder.js";

const voiceSampler = new Tone.Player("./samples/military-soldier-vocal-turn-the-mic-on.wav");
const mic = new Tone.UserMedia();
const pitchFft = new Tone.FFT();        
mic.connect(pitchFft);
const visualizer = new Visualizer(mic, "visualizer");

const vocoder = new Vocoder();
vocoder.modulator = mic;
vocoder.toDestination();

const loop = new Tone.Loop((time) => {
	voiceSampler.start(time);
	//vocoder.detune.setValueAtTime(previousTranspose, 0);
	vocoder.detune.setValueAtTime(transpose / 10, time);
	//vocoder.detune.setValueAtTime(0, time);
	//vocoder.detune.rampTo(600, time + "0.25m");
  vocoder.triggerAttackRelease("C2", "1m", time);
  
}, "1m").start(0);

const peakFrequency = document.getElementById("peakFrequency");
const historyLog = document.getElementById("midiNoteHistoryLog");
const startButton = document.getElementById("StartBtn");
const stopButton = document.getElementById("StopBtn");
stopButton.disabled = true;

var isRunning = false;

startButton.addEventListener("click", async () => {
	await Tone.start();
	startButton.disabled = true;
	stopButton.disabled = false;
	visualizer.isActive = true;
	
	transpose = 0;
	midiNoteHistory = [];
	historyLog.innerHTML = "";
	analyse();
	mic.open().then(() => {
		//analyse();
		Tone.Transport.start();
		isRunning = true;
		//analyse();
	}
	);
});

stopButton.addEventListener("click", () => {
	isRunning = false;
	Tone.Transport.stop();
	mic.close();
	visualizer.isActive = false;
	startButton.disabled = false;
	stopButton.disabled = true;
});

var midiNote = null;
var transpose = 0;
var midiNoteHistory = [];

function analyse() {
	const values = pitchFft.getValue();
	const freqBands = values.length;
	let highestValue = null;
	let highestValueFrequency= null;

	let oldMidiNote = midiNote;
	
  for (let i = 0; i < freqBands; i++) {
    const magnitude = values[i]; // Float between 0 and 1
    if (!highestValue || magnitude > highestValue) {
    	highestValue = magnitude;
    	highestValueFrequency = pitchFft.getFrequencyOfIndex(i);
    }
	}
	
	let note = Tone.Frequency(highestValueFrequency).toNote();
	
	let newMidiNote = Tone.Frequency(highestValueFrequency).toMidi();
	if (newMidiNote != midiNote) {
		midiNote = newMidiNote;
		midiNoteHistory.push(midiNote);
		historyLog.innerHTML += midiNote + ", ";
		transpose = (midiNote - oldMidiNote) * 100;
	}

	peakFrequency.innerText = `${highestValueFrequency} - ${note} [${transpose}]`;
	
	if (startButton.disabled)
		window.setTimeout(() => analyse(), 500);
}
	</script>
</body>

</html>
