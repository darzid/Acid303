name: Build and publish merged Acid303 page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Version Increment
        uses: reecetech/version-increment@2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch
  
      - name: Copy files
        run: |
          mkdir -p _site/dev
          cp app.js _site
          cp connect.html _site
          cp favicon.ico _site
          cp index.html _site
          cp jamconnect.js _site
          cp manifest.json _site
          cp service-worker.js _site
          cp styles.css _site
          cp tabcontrol.js _site
          cp visualizer.js _site
          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            git archive origin/dev app.js connect.html favicon.ico index.html jamconnect.js manifest.json service-worker.js styles.css tabcontrol.js visualizer.js | tar -x -C _site/dev/
          fi
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
