name: Build and publish merged Acid303 page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        
      - name: Version Increment
        uses: reecetech/version-increment@2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch

      - name: Copy files
        run: |
          mkdir -p _site
          
          cp index.html jamconnect-manifest.json jamconnect-app.js jamconnect-service-worker.js _site
          mkdir -p _site/css
          cp -r ./css/* _site/css
          
          mkdir -p _site/js
          cp -r ./js/* _site/js
          
          mkdir -p _site/jam909
          cp -r ./jam909/* _site/jam909
          
          mkdir -p _site/jam303
          cp -r ./jam303/* _site/jam303

          mkdir -p _site/jamFM
          cp -r ./jamFM/* _site/jamFM
          
          mkdir -p _site/jamMIDI
          cp -r ./jamMIDI/* _site/jamMIDI
          
          mkdir -p _site/jamVoice
          cp -r ./jamVoice/* _site/jamVoice
          

          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
