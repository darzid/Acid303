name: Build and publish merged Acid303 page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        
      - name: Version Increment
        uses: reecetech/version-increment@2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch

      - name: Copy files
        run: |
          mkdir -p _site
          cp index.html manifest.json app.js service-worker.js _site
          cp jam303.html jam303-manifest.json jam303-service-worker.js _site
          cp jam909.html jam909-manifest.json jam909-service-worker.js _site
          
          mkdir -p _site/css
          cp ./css/*.css _site/css
          
          mkdir -p _site/images
          cp ./images/*.* _site/images
          
          mkdir -p _site/js
          cp ./js/*.js _site/js
          
          mkdir -p _site/js/devices
          cp ./js/devices/*.js _site/js/devices
          
      - name: Build Tailwind CSS
          uses: ArnaudLigny/tailwind-builder@main
          with:
            working-directory: .
            input: css/tailwind.css
            output: _site/css/tailwind.css
            minify: true
            tailwind-version: latest
            
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
