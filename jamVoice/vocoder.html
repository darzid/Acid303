<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js"></script>
</head>

<body>
	<button id="StartBtn">Start</button>
	<button id="StopBtn">Stop</button>
	<canvas id="visualizer"></canvas>
	<script type="module">
import { Vocoder } from "./js/devices/Vocoder.js";
import { VoiceInstrumentPlayer } from "./js/voice-instrument-player.js";
import { Visualizer } from "../js/controls/Visualizer.js";

const vocoder = new Vocoder();
const voiceInstrumentPlayer = new VoiceInstrumentPlayer(vocoder.carrier);
vocoder.modulator = voiceInstrumentPlayer.voicePitchDetector.mic;
vocoder.toDestination();

const visualizer = new Visualizer(voiceInstrumentPlayer.voicePitchDetector.mic, "visualizer");

const peakFrequency = document.getElementById("peakFrequency");
const startButton = document.getElementById("StartBtn");
const stopButton = document.getElementById("StopBtn");
stopButton.disabled = true;

var rafId = null; 

startButton.addEventListener("click", async () => {
	await Tone.start();
	startButton.disabled = true;
	stopButton.disabled = false;
	visualizer.start();
  voiceInstrumentPlayer.start();
});

stopButton.addEventListener("click", () => {
	visualizer.stop();
	voiceInstrumentPlayer.stop();
	
	startButton.disabled = false;
	stopButton.disabled = true;
});
	</script>
</body>

</html>
