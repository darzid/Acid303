<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JamMIDI - MIDI internet bridge</title>
	
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="css/JAMmidi.css">
  
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/webmidi@latest/dist/iife/webmidi.iife.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
	<script src="https://darzid.github.io/JamConnect/jamconnect.js"></script>
</head>

<body class="flex flex-col bg-slate-950">

  <!-- Top Title Banner -->
  <header id="header" class="w-full max-w-6xl flex flex-col sm:flex-row justify-between items-center mb-2">
		<h1>JamMIDI</h1>
  </header>
	
	<main>
		<div id="tab-control">
	  	<div class="tab-strip flex items-center gap-1 p-1"></div>
	      
	    <div class="tab-container">
	    	<div title="MIDI" class="tab bg-slate-300/60 p-2 border border-slate-400/80 shadow-inner gap-2 mb-2 items-center">
	  		
	  			<div id="retrieveMidiDevices" title="Retrieve MIDI devices" class="action-container">
	  				<table id="midi-devices" class="action-output">
		  				<thead>
		  					<tr>
		  						<th width="1*">MIDI inputs</th>
		  						<th width="1*">MIDI outputs</th>
		  					</tr>
		  				</thead>
		  				<tbody>
		  					<tr>
		  						<td><div id="midi-inputs"></div></td>
		  						<td><div id="midi-outputs"></div></td>
		  					</tr>
		  				</tbody>
		  			</table>		
		  			
		  			<div id="midi-hint" class="action-output"></div>
		  		
		  			<div id="midi-log" class="action-output"></div>
					</div>
					

				</div>
				
				<div title="JAM" class="tab bg-slate-300/60 p-2 border border-slate-400/80 shadow-inner gap-2 mb-2 items-center">
					
					<div id="initializeJamConnect" title="Initialize JamConnect Client" class="action-container">

						<div class="action-output flex flex-wrap items-center justify-between gap-2">
								
							<div class="flex flex-wrap items-center gap-2">
								<button id="invite-btn" class="px-4 py-2 synth-btn text-amber-800 font-black rounded-lg text-xs sm:text-sm flex items-center gap-2 hover:bg-white">
									<i data-lucide="radio" class="w-4 h-4 fill-amber-700"></i> INVITE
								</button>
								<button id="join-btn" class="px-4 py-2 synth-btn text-amber-800 font-black rounded-lg text-xs sm:text-sm flex items-center gap-2 hover:bg-white">
									<i data-lucide="plug-zap" class="w-4 h-4 fill-amber-700"></i> JOIN
								</button>
		         	</div>
		          	
		         </div>
		
		         <div id="jamconnect" class="w-full action-output"></div>
		        </div>
				</div>
			</div>
	
		</div>
	</main>
    
  <script src="js/jam-MIDI-app.js" type="module"></script>
</body>

</html>
