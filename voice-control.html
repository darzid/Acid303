<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js"></script>
</head>

<body>
	<button id="StartBtn">Start</button>
	<button id="StopBtn">Stop</button>

	<div style="display: flex; gap: 10">
		<canvas id="level-meter" style="width: 20pt; margin-right: 5pt"></canvas>
		<canvas id="visualizer" style="width: 90vw"></canvas>
	</div>

  <span id="peak-info" style="display: none"><span id="change-type"></span> Note: <span id="peak-note"></span> (<span id="peak-frequency"></span>Hz), level: <span id="peak-level"></span></span>
	<script type="module">
import { VoiceInstrumentPlayer } from "./js/voice-instrument-player.js";
import { Visualizer } from "./js/visualizer.js";
import { LevelMeter } from "./js/level-meter.js";

const peakInfoElement = document.getElementById("peak-info");
const changeTypeElement = document.getElementById("change-type");
const peakFrequencyElement = document.getElementById("peak-frequency");
const peakLevelElement = document.getElementById("peak-level");
const peakNoteElement = document.getElementById("peak-note");
		
const synth = new Tone.Synth({portamento: "0.5s", oscillator: { type: "sawtooth"}});
const filter = new Tone.Filter({type: "lowpass", frequency: 500});
const delay = new Tone.PingPongDelay({delayTime: "8n.",
  feedback: 0.3,
  wet: 0.0
});
synth.connect(filter);
filter.connect(delay);
delay.toDestination();

const voiceInstrumentPlayer = new VoiceInstrumentPlayer(synth);
voiceInstrumentPlayer.voicePitchDetector.addEventListener("onVoiceDetected", (data) => {
  changeTypeElement.innerText = "Start ";
  peakFrequencyElement.innerText = data.frequency.toFixed(3);
  peakLevelElement.innerText = data.velocity;
	peakNoteElement.innerText = data.note;
	peakInfoElement.style.display = "inline";
});
voiceInstrumentPlayer.voicePitchDetector.addEventListener("onVoicePitchChangeDetected", (data) => {
  changeTypeElement.innerText = "Pitch ";
  peakFrequencyElement.innerText = data.frequency.toFixed(3) ;
  peakLevelElement.innerText = data.velocity;
	peakNoteElement.innerText = data.note + " [" + data.detune.toFixed(3) + " ct]";
	peakInfoElement.style.display = "inline";
});
voiceInstrumentPlayer.voicePitchDetector.addEventListener("onSilenceDetected", (data) => 
  peakInfoElement.style.display = "none"
);
			
const visualizer = new Visualizer(voiceInstrumentPlayer.voicePitchDetector.mic, "visualizer", { type: "SpectrumAnalyser" });
const levelMeter = new LevelMeter(voiceInstrumentPlayer.voicePitchDetector.mic, "level-meter", { direction: "Vertical"});

const startButton = document.getElementById("StartBtn");
const stopButton = document.getElementById("StopBtn");
stopButton.disabled = true;

startButton.addEventListener("click", async () => {
	await Tone.start();
	startButton.disabled = true;
	stopButton.disabled = false;
	visualizer.start();
	levelMeter.start();
	voiceInstrumentPlayer.start();
});

stopButton.addEventListener("click", () => {
	voiceInstrumentPlayer.stop();
	visualizer.stop();
	levelMeter.stop();
	startButton.disabled = false;
	stopButton.disabled = true;
});
	</script>
</body>

</html>
